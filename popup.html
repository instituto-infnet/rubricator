<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 650px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 10px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }
    textarea {
      width: 100%;
      height: 250px;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 12px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .options-container {
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .option-item {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .option-item:last-child {
      margin-bottom: 0;
    }
    .option-item input {
      margin-right: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #003f7a;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #007bff;
    }
  </style>
</head>
<body>

  <h3>Rubricator</h3>
  
  <!-- Campo onde você cola o texto da rubrica -->
  <textarea id="rubric-text" placeholder="Cole aqui seus itens de rubrica (separe linhas para novos critérios ou use ';' para quebrar linha no mesmo critério)..."></textarea>

  <!-- Opções de níveis que o popup.js vai ler -->
  <div class="options-container">
    <label class="option-item">
      <input type="radio" name="tipo_rubrica" value="padrao" checked>
      <span>2 Níveis (Não demonstrou / Demonstrou)</span>
    </label>
    <label class="option-item">
      <input type="radio" name="tipo_rubrica" value="quadruplo">
      <span>4 Níveis (ND, D, DL, DML)</span>
    </label>
  </div>

  <!-- Botão de disparo -->
  <button id="btn-enviar">Aplicar Rubricas</button>

  <script src="popup.js"></script>
</body>
</html>
